# Publicación en Netlify.
# Netlify construye la web en cada merge a main y crea una vista previa de cada PR,
# que se puede abrir en el móvil antes de aceptar el cambio.
# Cada publicación en main gasta 15 créditos del plan; las vistas previas no gastan.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Funciones de Netlify: trocitos de código que solo se encienden cuando alguien los usa.
# mochila.mjs manda por correo, con Brevo, el material de «Mi mochila» y boletin.mjs confirma el alta
# en el boletín. Usan la variable secreta BREVO_API_KEY, que está en Netlify y nunca en el repositorio.
# Cada uso gasta una fracción mínima de crédito: del orden de 5 créditos por cada 1.000 peticiones.
[functions]
  directory = "netlify/functions"

# Los archivos de _astro llevan su huella en el nombre: si cambian, cambia el nombre.
# El navegador puede guardarlos un año y así cada visita pide menos al servidor.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Los PDF se descargan desde «Mi mochila». Esta cabecera pide a los buscadores que no los
# enseñen en sus resultados: quien llega desde Google entra por la ficha del material.
# El enlace directo de un PDF sigue funcionando si alguien lo comparte.
[[headers]]
  for = "/descargas/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# La página para confirmar el boletín solo sirve a quien llega desde su correo, y el catálogo de la
# mochila es para la función de Netlify: ninguno de los dos tiene que salir en los buscadores.
[[headers]]
  for = "/boletin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/datos/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# La dirección principal es www.ideducando.es (15/10/2026). Netlify ya lleva ahí a quien
# entra por ideducando.es; esta regla hace lo mismo con la dirección de Netlify, para que
# los enlaces antiguos, como los de los PDF descargados antes, acaben en el dominio.
# Las vistas previas de los PR tienen otra dirección y no les afecta.
[[redirects]]
  from = "https://ideducando.netlify.app/*"
  to = "https://www.ideducando.es/:splat"
  status = 301
  force = true

# «Mi bolsa» pasó a llamarse «Mi mochila» el 20/10/2026. Quien tenga guardada la dirección
# antigua llega a la nueva.
[[redirects]]
  from = "/mi-bolsa/"
  to = "/mi-mochila/"
  status = 301
